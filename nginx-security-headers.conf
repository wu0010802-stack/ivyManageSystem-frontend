# 安全標頭 snippet — 由 nginx.conf.template 在各靜態內容 location 以 include 載入。
#
# 為什麼用 include 而非寫在 server 層：nginx 的 add_header「不繼承」——只要某個
# location 自己有任何 add_header（本專案 index.html / parent.html / assets 等都有
# Cache-Control），它就完全不會繼承 server 層的 add_header。需要 CSP / X-Frame-Options
# 的正是這些有自己 add_header 的 HTML location，故必須在每個 location 顯式 include。
# 此檔非 nginx templates（不經 envsubst），內容原樣生效。
#
# 後端 utils/security_headers.py 的 middleware 只覆蓋 /api/* 回應（JSON），SPA 文件
# （index/parent/public.html）由 nginx 直接服務、過去零安全標頭，故在此補上。

# ── 強制生效（不會打破前端；提供 clickjacking / MIME 嗅探 / referrer 防護）──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── CSP：強制生效（enforcing）────────────────────────────────────────────────
# ⚠⚠ 合併本分支 / push 前必做（push = Zeabur 自動部署到 prod）：
#   此 policy 從未在真實 HTML 文件上驗證過（後端那份只貼在 /api JSON，對資源載入無意義）。
#   翻成強制後，任何未放行的資源會被「阻擋」而非僅回報，可能打破：
#     - 家長端 LIFF：@line/liff 的 liff.init() 執行期 fetch *.line.me（受 connect-src 管轄）
#     - 招生地圖：Google Maps / OSM・CARTO 底圖 / Nominatim 地理編碼
#     - 管理端：Element Plus / Vue scoped style（靠 style-src 'unsafe-inline'）
#   ⇒ 必須先在 staging 跑「家長 LIFF 登入 + 管理端 + Google Maps + OSM/CARTO 底圖 +
#     Nominatim 地理編碼」全路徑，用瀏覽器 console 確認 0 CSP violation，才可合併/push。
# 下方 policy 已「預先」放行目前已知會被前端載入的第三方 host：
#   - LINE / LIFF：connect-src api.line.me / liff.line.me / liffsdk.line-scdn.net，frame-src *.line.me
#   - 招生地理編碼：connect-src nominatim.openstreetmap.org
#   - 招生熱力圖底圖：img-src *.cartocdn.com
# 建議與後端 utils/security_headers.py 的 _build_csp() 收斂為同一份來源以免兩邊漂移。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://*.cartocdn.com; connect-src 'self' https://maps.googleapis.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://api.line.me https://liff.line.me https://liffsdk.line-scdn.net wss: ws:; frame-src https://*.line.me; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
