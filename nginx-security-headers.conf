# 安全標頭 snippet — 由 nginx.conf.template 在各靜態內容 location 以 include 載入。
#
# 為什麼用 include 而非寫在 server 層：nginx 的 add_header「不繼承」——只要某個
# location 自己有任何 add_header（本專案 index.html / parent.html / assets 等都有
# Cache-Control），它就完全不會繼承 server 層的 add_header。需要 CSP / X-Frame-Options
# 的正是這些有自己 add_header 的 HTML location，故必須在每個 location 顯式 include。
# 此檔非 nginx templates（不經 envsubst），內容原樣生效。
#
# 後端 utils/security_headers.py 的 middleware 只覆蓋 /api/* 回應（JSON），SPA 文件
# （index/parent/public.html）由 nginx 直接服務、過去零安全標頭，故在此補上。

# ── 強制生效（不會打破前端；提供 clickjacking / MIME 嗅探 / referrer 防護）──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── CSP：先以 Report-Only 上線（只回報、不阻擋）──────────────────────────────
# 理由：後端那份 CSP 一直只貼在 /api 的 JSON 回應上（對 JSON 無資源載入意義），
# 從未在真實 HTML 文件上驗證過。直接強制套到 parent.html 會打破家長端 LIFF：
#   - @line/liff 的 liff.init() 執行期會 fetch LINE endpoints（*.line.me），
#     受 connect-src 管轄，而下方 connect-src 沒有放行任何 *.line.me。
# 因此先用 Content-Security-Policy-Report-Only 收集違規，確認 staging 上
# 「家長 LIFF 登入 + 管理端 + Google Maps + OSM 地圖」皆無 CSP 違規後，
# 再把 header 名稱改成 Content-Security-Policy（強制），並視回報補上：
#   - connect-src 追加 https://api.line.me https://liff.line.me https://liffsdk.line-scdn.net（及實測回報的其他 *.line.me）
#   - 如有 LIFF iframe，追加 frame-src https://*.line.me
# 翻成強制時，建議與後端 _build_csp() 收斂為同一份來源以免兩邊漂移。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org; connect-src 'self' https://maps.googleapis.com https://*.tile.openstreetmap.org wss: ws:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
