# 安全標頭 snippet — 由 nginx.conf.template 在各靜態內容 location 以 include 載入。
#
# 為什麼用 include 而非寫在 server 層：nginx 的 add_header「不繼承」——只要某個
# location 自己有任何 add_header（本專案 index.html / parent.html / assets 等都有
# Cache-Control），它就完全不會繼承 server 層的 add_header。需要 CSP / X-Frame-Options
# 的正是這些有自己 add_header 的 HTML location，故必須在每個 location 顯式 include。
# 此檔非 nginx templates（不經 envsubst），內容原樣生效。
#
# 後端 utils/security_headers.py 的 middleware 只覆蓋 /api/* 回應（JSON），SPA 文件
# （index/parent/public.html）由 nginx 直接服務、過去零安全標頭，故在此補上。

# ── 強制生效（不會打破前端；提供 clickjacking / MIME 嗅探 / referrer 防護）──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── CSP：先以 Report-Only 上線（只回報、不阻擋）──────────────────────────────
# 理由：後端那份 CSP 一直只貼在 /api 的 JSON 回應上（對 JSON 無資源載入意義），
# 從未在真實 HTML 文件上驗證過。直接強制套到 parent.html 會打破家長端 LIFF：
#   - @line/liff 的 liff.init() 執行期會 fetch LINE endpoints（*.line.me），
#     受 connect-src 管轄，而下方 connect-src 沒有放行任何 *.line.me。
# 因此先用 Content-Security-Policy-Report-Only 收集違規。下方 policy 已「預先」補上
# 目前已知會被前端載入、但原本未放行的第三方 host（切 enforcing 前的 prep；仍不阻擋）：
#   - LINE / LIFF：connect-src + api.line.me / liff.line.me / liffsdk.line-scdn.net，
#     frame-src *.line.me（liff.init 執行期 fetch + 可能的 LIFF iframe）
#   - 招生地理編碼：connect-src + nominatim.openstreetmap.org
#   - 招生熱力圖底圖：img-src + *.cartocdn.com
# 實際切 enforcing 前的待辦：在 staging 跑「家長 LIFF 登入 + 管理端 + Google Maps +
# OSM/CARTO 底圖 + Nominatim 地理編碼」全路徑、確認 0 violation 後，再把 header 名稱
# 改成 Content-Security-Policy（強制）。翻成強制時，建議與後端 _build_csp() 收斂為同一
# 份來源以免兩邊漂移。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://*.cartocdn.com; connect-src 'self' https://maps.googleapis.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://api.line.me https://liff.line.me https://liffsdk.line-scdn.net wss: ws:; frame-src https://*.line.me; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
