# 安全標頭 snippet — 由 nginx.conf.template 在各靜態內容 location 以 include 載入。
#
# 為什麼用 include 而非寫在 server 層：nginx 的 add_header「不繼承」——只要某個
# location 自己有任何 add_header（本專案 index.html / parent.html / assets 等都有
# Cache-Control），它就完全不會繼承 server 層的 add_header。需要 CSP / X-Frame-Options
# 的正是這些有自己 add_header 的 HTML location，故必須在每個 location 顯式 include。
# 此檔非 nginx templates（不經 envsubst），內容原樣生效。
#
# 後端 utils/security_headers.py 的 middleware 只覆蓋 /api/* 回應（JSON），SPA 文件
# （index/parent/public.html）由 nginx 直接服務、過去零安全標頭，故在此補上。

# ── 強制生效（不會打破前端；提供 clickjacking / MIME 嗅探 / referrer 防護）──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── CSP：強制生效（enforcing）────────────────────────────────────────────────
# 2026-07-22 於 prod（ivypreschool.tw，走 Cloudflare）以真實瀏覽器實測登入頁 +
# parent.html，抓到並修正 2 個 enforcing 下的 violation（見下方放行說明）。保留
# enforcing（不退 report-only）——退回等於放棄 CSP 保護；缺的資源改以精準白名單放行。
# 放行清單來源：
#   - LINE / LIFF：connect-src api.line.me / liff.line.me / liffsdk.line-scdn.net，frame-src *.line.me
#   - 公開報名頁課程影片（VideoModal / hover 預覽皆 www.youtube.com/embed iframe）：
#       frame-src www.youtube.com（2026-08-01 staging 實測：缺此網域 iframe 被 enforcing CSP 擋成灰色破圖）
#   - 招生地圖：script-src/connect-src maps.googleapis.com，img-src *.gstatic.com
#   - 招生地理編碼：connect-src nominatim.openstreetmap.org；熱力圖底圖：img-src *.cartocdn.com / *.tile.openstreetmap.org
#   - IcoMoon 圖示字型內嵌為 data: URI → font-src 需 data:（實測 violation #1，否則圖示破框）
#   - Cloudflare Web Analytics beacon（CF 代理層自動注入到 HTML）：
#       script-src static.cloudflareinsights.com（載入 beacon.min.js，實測 violation #2）
#       connect-src cloudflareinsights.com（beacon POST /cdn-cgi/rum 回報）
#     若不需要 CF Web Analytics，改在 Cloudflare 儀表板關閉自動注入，即可從白名單移除這兩項。
# ⚠ 新增前端第三方資源（新地圖/字型/analytics）時：先在 staging 用瀏覽器 console 驗 0
#   violation 再合併；並評估是否需與後端 utils/security_headers.py 的 _build_csp() 同步。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://*.cartocdn.com; connect-src 'self' https://maps.googleapis.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://api.line.me https://liff.line.me https://liffsdk.line-scdn.net https://cloudflareinsights.com wss: ws:; frame-src https://*.line.me https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
