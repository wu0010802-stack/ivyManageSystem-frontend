name: Frontend CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  release:
    types: [published]
  # 2026-08-23 CI 重構：允許手動補跑（供 promote.sh 的「staging CI 綠」閘門查驗）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ============================================================================
# 2026-08-23 CI 提速重構：原單一 Tests & Build job 串行 11+ 分鐘，其中 vitest
# coverage 佔 ~10 分鐘。改為：
#   - test：vitest 以 --shard 切 2 片並行（blob reporter 內嵌 coverage 資料；
#     分片層 thresholds 顯式歸零——單片覆蓋率天然低於全套門檻，不歸零會假紅）
#   - coverage：--merge-reports 合併 blob 後套 vitest.config.js 的 thresholds
#     把關（門檻值仍以 config 為單一來源，contract test 釘住）
#   - checks：typecheck / eslint / 各棘輪 / build 獨立平行 job（步驟順序與
#     條件逐字保留，Sentry secret 隔離契約見 tests/unit/ci/sentryWorkflow.test.ts）
# wall-clock 11 分 → 約 6 分；public repo 免計費，多 job 無成本代價。
# ============================================================================

jobs:
  audit:
    name: 依賴 CVE 掃描（HIGH-1）
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0（原 @v6）
        with:
          node-version: "24"
          cache: npm

      - name: Run npm audit
        # Build/CI 依賴可讀取原始碼、token 與生成物；不可省略 devDependencies，
        # 否則會漏掉此信任邊界的供應鏈漏洞。（守則見
        # tests/unit/ci/sentryWorkflow.test.ts）
        #
        # 掃描維持全樹 `npm audit --audit-level=moderate`，只是改由 script 判定
        # 結果：少數「上游鎖死、確認無版本可升」的 advisory 可在
        # .github/audit-allowlist.json 具名豁免。若不給豁免機制，gate 會因為修不掉
        # 的漏洞永遠紅燈，main 的必要檢查等同卡死、任何 PR 都合不進來，所有掃描
        # 反而一起失效。每筆豁免都有到期日，過期即轉紅強制重新檢討。
        run: node scripts/check-audit-allowlist.mjs

  test:
    name: Tests（vitest 分片 ${{ matrix.shard }}/2）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0（原 @v6）
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests（分片 ${{ matrix.shard }}/2，blob 內嵌 coverage）
        # thresholds 歸零：單片覆蓋率天然低於全套門檻（config 的 61/54/52/63 是
        # 全套件基線），門檻檢查集中到 coverage job 合併後執行才有意義。
        # blob reporter 會把原始 V8 coverage 一併寫入 .vitest-reports/，
        # 供 --merge-reports 重算整體覆蓋率（本地已實證兩端行為）。
        run: |
          npx vitest run --shard=${{ matrix.shard }}/2 \
            --reporter=default --reporter=blob --coverage --coverage.reporter=text-summary \
            --coverage.thresholds.statements=0 --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Upload blob report（分片 ${{ matrix.shard }}）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2（原 @v7）
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true  # .vitest-reports 為 dot 目錄，預設被排除
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage Gate（合併分片 → vitest.config.js thresholds）
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0（原 @v6）
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0（原 @v4）
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports + coverage gate
        # --merge-reports 讀 .vitest-reports/ 的 blob（含每片 V8 coverage），
        # 重算整體覆蓋率並套 vitest.config.js 的 thresholds（61/54/52/63，
        # 門檻單一來源仍在 config，tests/unit/ci/vitestConcurrency.test.ts 釘住）。
        # 本地已實證：合併端未達門檻確實 exit 1（fail-closed）。
        run: npx vitest run --merge-reports --coverage

  checks:
    name: Static Checks & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0（原 @v6）
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check（TS strict — L9 起改 blocking，TS errors 阻擋 PR）
        run: npm run typecheck

      - name: ESLint（no-explicit-any — blocking；新 any 一律擋，遺留以 inline disable 棘輪 grandfather）
        run: npm run lint

      # 原本是 continue-on-error 的 warn-only，等於沒有防線：token 存量從 main 的
      # 1678 一路漲到 staging 的 1795。改 blocking 棘輪（逐 prefix 只准降不准升），
      # 同時涵蓋 stylelint 的 error severity 規則 —— 所以不需要另外跑 lint:css。
      - name: Design token 棘輪 + stylelint（逐 prefix 只准降不准升）
        run: npm run lint:tokens

      - name: 錯誤處理棘輪（直讀 response.data.detail 只准降不准升）
        run: npm run check:error-detail

      # api 層沒帶產生型別的呼叫（回傳 AxiosResponse<any>）只准降不准升；
      # 後端補了 response_model 就該改用 AxiosResp<'/path', 'method'>。
      - name: api 型別棘輪（沒有型別的 api 呼叫只准降不准升）
        run: npm run check:untyped-api

      # 表單 dialog 棘輪：裸 el-dialog 表單／label-width／硬寫 px 寬度／新增鈕誤用 success 或「＋」
      # 只准降不准升；新表單一律 FormDialog（spec 2026-09-06-admin-form-dialog-defaults）。
      - name: 表單 dialog 棘輪（FormDialog 採用、label-width、px 寬度、按鈕誤用）
        run: npm run check:form-dialogs

      # 可點擊但 Tab 不到的元素（div/li @click 沒補 role/tabindex/keydown）。
      # 存量分三類、修法各不同，見腳本頂部註解。
      - name: a11y 棘輪（可點擊元素必須鍵盤可及）
        run: npm run check:a11y

      # 家長端視覺一致性防回歸：綠 fallback 殘骸、主按鈕誤用 --pt-info-link、
      # background/color 直寫 hex。腳本已存在且是綠的，只是從沒進 CI。
      - name: 家長端視覺一致性稽核
        run: npm run parent:audit

      - name: Build check (PR, no Sentry secrets)
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Build check (trusted main/release)
        if: github.event_name != 'pull_request'
        env:
          # 只有受信任的 main push / published release 會進此 step；PR step 完全不引用 secrets。
          SENTRY_UPLOAD_TRUSTED: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ivy-frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）
        with:
          path: ivy-frontend

      - name: 檢查後端 repo 唯讀憑證
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if ! test -n "$BACKEND_REPO_TOKEN"; then
            echo "::error::請設定 BACKEND_REPO_TOKEN：僅授予 ivyManageSystem-backend Contents: Read 的 fine-grained PAT，存入前端 repository Actions secret。"
            exit 1
          fi

      - name: Checkout ivy-backend (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（原 @v7）
        with:
          repository: ${{ github.repository_owner }}/ivyManageSystem-backend
          path: ivy-backend
          # 預設的 GITHUB_TOKEN 只對「當前 repo」有效，無法 checkout 另一個私有
          # repo——這一步從設定之初就一直失敗，後面 8 個步驟全被 skip，等於這個
          # gate 從未真正跑過。需要一顆對 ivyManageSystem-backend 有 Contents:
          # Read 的 fine-grained PAT，存成本 repo 的 BACKEND_REPO_TOKEN secret。
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      # 後端版本選擇順序：同名分支 → PR 的 base 分支 → 後端 main。
      # 前端 feature 分支打進 staging 時，後端通常沒有同名分支；若直接退回後端 main，
      # 會拿 main 的 API 去比對依後端 staging 產生的 schema.d.ts，必定漂移
      # （2026-10 feat/mobile-ux-phase3、feat/parent-uiux-optimization 皆因此紅燈）。
      # push 事件沒有 base_ref，行為與改動前相同。
      - name: Prefer companion backend ref when it exists
        working-directory: ivy-backend
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          for ref in "${CANDIDATE_REF:-}" "${BASE_REF:-}"; do
            if [ -n "$ref" ] && \
               git fetch --no-tags origin "refs/heads/${ref}:refs/remotes/origin/companion"; then
              git checkout --detach refs/remotes/origin/companion
              echo "Using companion backend ref: ${ref}"
              exit 0
            fi
          done
          echo "Companion backend ref unavailable; using backend main"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0（原 @v6）
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ivy-backend/requirements.lock

      - name: Install backend deps
        working-directory: ivy-backend
        run: pip install --require-hashes -r requirements.lock

      - name: Dump openapi.json
        working-directory: ivy-backend
        env:
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python scripts/dump_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0（原 @v6）
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ivy-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ivy-frontend
        run: npm ci

      - name: Run drift check
        working-directory: ivy-frontend
        run: npm run gen:api:check

      # 跨 repo 雙寫常數（基本工資/退費門檻/才藝獎金）的單側漂移守衛。
      # 此 job 是唯一兩 repo 並存的地方（後端已 checkout 成 ../ivy-backend）。
      - name: Check cross-repo shared constants
        working-directory: ivy-frontend
        run: npm run check:shared-constants

      # FE/BE 雙寫清單的 parity 測試（測試本體在後端 repo）。原本只有後端 CI 的
      # cross-repo-parity job 會跑，且拿的是前端同名分支／base／main——前端 PR 改了
      # 權限、PII denylist、lifecycle 或招生漏斗常數，前端 CI 完全不會紅，
      # 要等後端下一次 CI 才發現。這裡用剛 checkout 的「這次前端改動」對上後端
      # companion ref 直接跑，sibling layout（../ivy-frontend）與後端 job 相同。
      # 帶 *_REQUIRE_FRONTEND=1：缺 sibling 時 fail 而非 skip。後端 companion ref 若還沒有
      # 該測試檔（例如 lifecycle parity 尚未併進後端 staging／main）則警告後略過，不誤紅。
      # quick action module parity 暫不接：前端 QUICK_ACTION_CATALOG 已改成由
      # QUICK_ACTION_KEYS 推導（Object.fromEntries），後端 test_quick_action_module_parity.py
      # 的 regex 抽不到 key，接上會立刻紅；等後端 parser 跟上再補這一步。

      - name: Run FE/BE PII denylist parity test
        if: ${{ !cancelled() }}
        working-directory: ivy-backend
        env:
          PII_PARITY_REQUIRE_FRONTEND: "1"
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          if [ ! -f tests/test_pii_denylist_parity.py ]; then
            echo "::warning::後端 companion ref 沒有 tests/test_pii_denylist_parity.py（測試尚未併進該分支），略過"
            exit 0
          fi
          python -m pytest tests/test_pii_denylist_parity.py -v -p no:cacheprovider

      - name: Run FE/BE Permission parity test
        if: ${{ !cancelled() }}
        working-directory: ivy-backend
        env:
          PERMISSION_PARITY_REQUIRE_FRONTEND: "1"
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          if [ ! -f tests/test_permission_parity.py ]; then
            echo "::warning::後端 companion ref 沒有 tests/test_permission_parity.py（測試尚未併進該分支），略過"
            exit 0
          fi
          python -m pytest tests/test_permission_parity.py -v -p no:cacheprovider

      - name: Run FE/BE lifecycle & recruitment funnel parity test
        if: ${{ !cancelled() }}
        working-directory: ivy-backend
        env:
          LIFECYCLE_PARITY_REQUIRE_FRONTEND: "1"
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          if [ ! -f tests/test_lifecycle_funnel_parity.py ]; then
            echo "::warning::後端 companion ref 沒有 tests/test_lifecycle_funnel_parity.py（測試尚未併進該分支），略過"
            exit 0
          fi
          python -m pytest tests/test_lifecycle_funnel_parity.py -v -p no:cacheprovider
