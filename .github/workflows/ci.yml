name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 依賴 CVE 掃描（HIGH-1）
        run: npm audit --production --audit-level=moderate

      - name: Run tests
        run: npm run test

      - name: Type check（過渡期 warning 模式，不阻擋 PR；L9 收尾改 blocking）
        run: npm run typecheck
        continue-on-error: true

      - name: Build check
        run: npm run build

  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ivy-frontend
        uses: actions/checkout@v4
        with:
          path: ivy-frontend

      - name: Checkout ivy-backend (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ivy-backend
          path: ivy-backend
          token: ${{ secrets.IVY_CROSS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ivy-backend/requirements.txt

      - name: Install backend deps
        working-directory: ivy-backend
        run: pip install -r requirements.txt

      - name: Dump openapi.json
        working-directory: ivy-backend
        env:
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python scripts/dump_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ivy-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ivy-frontend
        run: npm ci

      - name: Run drift check
        working-directory: ivy-frontend
        run: npm run gen:api:check
