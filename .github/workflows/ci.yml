name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: 依賴 CVE 掃描（HIGH-1）
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=moderate

  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type check（TS strict — L9 起改 blocking，TS errors 阻擋 PR）
        run: npm run typecheck

      - name: ESLint（no-explicit-any — blocking；新 any 一律擋，遺留以 inline disable 棘輪 grandfather）
        run: npm run lint

      - name: Lint tokens (baseline, warn only)
        run: npm run lint:tokens
        continue-on-error: true

      - name: Build check
        env:
          # Sentry sourcemap 上傳：vite.config.js 用 SENTRY_AUTH_TOKEN 作為 enable gate；
          # 三 secret 全空時 sentryVitePlugin disable=true、sourcemap=false（dist 不含 .map）。
          # User 在 Settings → Secrets 各別設好後自動開啟上傳。
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ivy-frontend
        uses: actions/checkout@v4
        with:
          path: ivy-frontend

      - name: Checkout ivy-backend (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ivyManageSystem-backend
          path: ivy-backend

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ivy-backend/requirements.txt

      - name: Install backend deps
        working-directory: ivy-backend
        run: pip install -r requirements.txt

      - name: Dump openapi.json
        working-directory: ivy-backend
        env:
          ENV: development
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python scripts/dump_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ivy-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ivy-frontend
        run: npm ci

      - name: Run drift check
        working-directory: ivy-frontend
        run: npm run gen:api:check

      # 跨 repo 雙寫常數（基本工資/退費門檻/才藝獎金）的單側漂移守衛。
      # 此 job 是唯一兩 repo 並存的地方（後端已 checkout 成 ../ivy-backend）。
      - name: Check cross-repo shared constants
        working-directory: ivy-frontend
        run: npm run check:shared-constants
