<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/LOGO.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- M3 redesign：theme-color 跟 IvyKids 深綠主色 -->
    <meta name="theme-color" content="{{TB_THEME_PARENT}}">
    <!-- TODO: 家長品牌 icon 待設計師提供後替換 public/parent-pwa-*.png（目前 fallback admin icon）-->
    <link rel="manifest" href="/parent.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="{{TB_PARENT_TITLE}}">
    <title>{{TB_PARENT_TITLE}}</title>

    <!-- 中文字型：Noto Sans TC（IvyKids 品牌字）。font-display: swap 避免 FOIT。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ⚠ 不得用 media="print" onload="this.media='all'" 的非阻塞手法：
         nginx CSP 的 script-src 無 unsafe-inline，inline onload 會被擋下，
         stylesheet 永遠停在 media=print → Material Symbols 永不套用，
         全 app 圖示 render 成 ligature 原文（2026-08-12 prod 實測事故）。
         display=swap 已避免 FOIT，直接同步載入即可。 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <!-- Material Symbols Rounded 已改自架子集字型（src/parent/styles/icons.css，2026-08-13）：
         LIFF WebView 對 Google CDN 慢/不可達時 display=swap 會讓全 app 圖示
         render 成 ligature 原文（check_circle 等英文字串）撐爆版面。
         同源 woff2 + font-display: block 根治；重產：npm run gen:parent-icons -->
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/parent/main.ts"></script>
</body>

</html>
