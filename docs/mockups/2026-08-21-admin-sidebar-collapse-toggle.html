<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="ivy-mockup-status" content="design-preview-non-functional" />
<title>側邊欄收合按鈕搬移示意</title>
<style>
/* ============================================================
   Design tokens — 逐值核對自 src/assets/design-tokens.css / a11y.css
   （2026-08-21 讀檔核對，非憑印象複製）。設計稿為獨立 HTML，允許落地 hex；
   正式實作（AdminSidebar.vue）已改回 var(--...)，此檔僅供視覺確認。
   ============================================================ */
:root {
  --neutral-700: #334155;
  --neutral-900: #0f172a;
  --text-tertiary: #94a3b8;

  --sidebar-bg: #1e2a3a;
  --sidebar-bg-active: #314257;
  --sidebar-text: #94a3b8;
  --sidebar-text-hover: #e2e8f0;
  --sidebar-text-active: #7dd3fc;

  --bg-color: #f8fafc;
  --text-primary: #1e293b;
  --text-secondary: #64748b;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-5: 20px; --space-6: 24px;
  --radius-md: 8px;
  --transition-base: .2s ease;
  --transition-slow: .3s cubic-bezier(.4,0,.2,1);
  --text-xl: 18px;
  --el-color-primary: #0284c7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
  background: var(--bg-color);
  color: var(--text-primary);
  padding: 76px var(--space-6) var(--space-6);
}

.preview-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: #0f172a; color: #e2e8f0;
  padding: var(--space-2) var(--space-6);
  font-size: 13px;
  display: flex; align-items: center; gap: var(--space-3);
  border-bottom: 1px solid var(--neutral-700);
}
.preview-banner b { color: #7dd3fc; }

.layout {
  display: flex;
  gap: var(--space-6);
  flex-wrap: wrap;
  align-items: flex-start;
}

.panel {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  overflow: hidden;
}

.panel-label {
  padding: var(--space-3) var(--space-5) 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.panel-body {
  padding: var(--space-5);
  display: flex;
  gap: var(--space-5);
}

/* ---- Sidebar 骨架（逐值對照 AdminSidebar.vue <style scoped>） ---- */
.admin-sidebar {
  background-color: var(--sidebar-bg);
  color: #fff;
  height: 560px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--neutral-700);
  box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
  transition: width var(--transition-slow);
}

.admin-sidebar.expanded { width: 260px; }
.admin-sidebar.collapsed { width: 64px; }

.logo-container {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3) 0 var(--space-5);
  background-color: var(--neutral-900);
  border-bottom: 1px solid var(--neutral-700);
  overflow: hidden;
  white-space: nowrap;
}

.admin-sidebar.collapsed .logo-container {
  justify-content: center;
  padding: 0;
}

.logo-icon-img {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  object-fit: cover;
  flex-shrink: 0;
  background: linear-gradient(135deg, #7dd3fc, #0284c7);
}

.logo-text {
  margin-left: var(--space-3);
  font-size: var(--text-xl);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
}

.collapse-toggle {
  appearance: none;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  transition: background-color var(--transition-base), color var(--transition-base);
}

.collapse-toggle:hover {
  background-color: var(--neutral-700);
  color: #fff;
}

.collapse-toggle svg { width: 18px; height: 18px; }

.menu {
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.menu-item {
  height: 50px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-3);
  color: var(--sidebar-text);
  font-size: 14px;
  white-space: nowrap;
}

.admin-sidebar.collapsed .menu-item {
  justify-content: center;
  padding: 0;
}

.menu-item.active {
  background-color: var(--sidebar-bg-active);
  color: var(--sidebar-text-active);
}

.menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }

.annotation {
  margin-top: var(--space-3);
  font-size: 12px;
  color: var(--text-secondary);
  max-width: 260px;
  line-height: 1.6;
}

.annotation code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 4px;
  font-size: 11px;
}
</style>
</head>
<body>
<div class="preview-banner">
  <span>設計稿・非可互動實體</span>
  <span><b>AdminSidebar.vue</b> — 收合/展開按鈕從底部搬到 logo 列右側</span>
</div>

<div class="layout">
  <div>
    <div class="panel">
      <div class="panel-label">展開狀態（260px）</div>
      <div class="panel-body">
        <div class="admin-sidebar expanded">
          <div class="logo-container">
            <img src="" class="logo-icon-img" alt="" />
            <span class="logo-text">常春藤管理系統</span>
            <span style="flex:1"></span>
            <button class="collapse-toggle" aria-label="收合側邊欄" style="margin-left:auto">
              <!-- Fold icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round"/><path d="M21 9l-3 3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="menu">
            <div class="menu-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span>儀表板</span>
            </div>
            <div class="menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
              <span>工作台</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="annotation">
      Logo 列左側是 LOGO icon + 系統名稱（<code>logo-text</code>），右側新增一顆收合按鈕（Fold icon），點擊後觸發 <code>toggleCollapse()</code>。
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="panel-label">收合狀態（64px）</div>
      <div class="panel-body">
        <div class="admin-sidebar collapsed">
          <div class="logo-container">
            <button class="collapse-toggle" aria-label="展開側邊欄">
              <!-- Expand icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 12h10M4 18h16" stroke-linecap="round"/><path d="M7 9l-3 3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="menu">
            <div class="menu-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <div class="menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="annotation">
      收合後寬度縮到 64px，LOGO 圖片與文字一併隱藏（<code>v-if="isMobile || !isCollapse"</code>），logo 列只剩下置中的展開按鈕（Expand icon），點擊可展開回來。
    </div>
  </div>
</div>
</body>
</html>
