<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="ivy-mockup-status" content="design-preview-non-functional" />
<title>接送排隊台</title>
<style>
/* ============================================================
   Design tokens — 逐值核對自 src/assets/design-tokens.css（html.ivy-admin scope，
   2026-08-20 讀檔核對，非憑印象複製）。設計稿為獨立 HTML，允許落地 hex；
   正式實作時一律改回 var(--...) 由 design-tokens.css 提供。
   ============================================================ */
:root {
  --brand-primary: #0284c7;         /* admin accent = sky（非 root default 的 indigo） */
  --brand-primary-hover: #0369a1;
  --brand-primary-soft: #e0f2fe;

  --neutral-0: #ffffff; --neutral-50: #f8fafc; --neutral-100: #f1f5f9;
  --neutral-200: #e2e8f0; --neutral-300: #cbd5e1; --neutral-400: #94a3b8;
  --neutral-500: #64748b; --neutral-600: #475569; --neutral-700: #334155;
  --neutral-800: #1e293b; --neutral-900: #0f172a;

  --color-success: #10b981; --color-success-soft: #dcfce7; --color-success-darker: #15803d;
  --color-warning: #f59e0b; --color-warning-soft: #fef3c7; --color-warning-darker: #b45309;
  --color-danger: #ef4444;  --color-danger-soft: #fee2e2;  --color-danger-darker: #b91c1c;
  --color-info: #3b82f6;    --color-info-soft: #dbeafe;    --color-info-darker: #1d4ed8;

  --sidebar-bg: #1e2a3a; --sidebar-bg-active: #314257;
  --sidebar-text: #94a3b8; --sidebar-text-hover: #e2e8f0; --sidebar-text-active: #7dd3fc;

  --bg-color: var(--neutral-50); --bg-color-soft: var(--neutral-100);
  --surface-color: var(--neutral-0);
  --text-primary: var(--neutral-800); --text-secondary: var(--neutral-500); --text-tertiary: var(--neutral-400);
  --border-color: var(--neutral-200); --border-color-light: var(--neutral-100);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --transition-fast: .15s ease; --transition-base: .2s ease;
  --transition-slow: .3s cubic-bezier(.4,0,.2,1);
  --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px;
  --text-xl: 18px; --text-2xl: 20px; --text-3xl: 24px; --text-4xl: 30px;
  --touch-target-min: 44px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
  font-size: var(--text-base); line-height: 1.5; color: var(--text-primary);
  background: var(--bg-color); overflow: hidden;
}

/* ---- 設計稿提示 bar（非產品 UI，僅本檔說明用）---- */
.preview-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  padding: 6px 16px; background: var(--neutral-800); color: #fff;
  font-size: var(--text-xs); text-align: center; letter-spacing: .02em;
}

.app-shell { display: flex; height: 100vh; padding-top: 28px; }

/* ---- 側欄：收合成 icon rail（POS 高密度頁面，不佔用主要工作區寬度）---- */
.rail {
  width: 64px; flex-shrink: 0; height: calc(100vh - 28px);
  background: var(--sidebar-bg); display: flex; flex-direction: column;
  align-items: center; padding: var(--space-4) 0; gap: var(--space-2);
}
.rail__logo {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  background: var(--brand-primary); color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: var(--text-base); margin-bottom: var(--space-4);
}
.rail__icon {
  width: 44px; height: 44px; border-radius: var(--radius-md);
  display: grid; place-items: center; color: var(--sidebar-text);
  font-size: 18px; cursor: pointer; transition: background-color var(--transition-fast), color var(--transition-fast);
}
.rail__icon:hover { color: var(--sidebar-text-hover); background: rgba(255,255,255,.06); }
.rail__icon.is-active { background: var(--sidebar-bg-active); color: var(--sidebar-text-active); }

/* ---- 主頁面 ---- */
.page { flex: 1; min-width: 0; display: flex; flex-direction: column; height: calc(100vh - 28px); }

.page-header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  background: var(--surface-color); border-bottom: 1px solid var(--border-color);
}
.page-header__title { display: flex; align-items: center; gap: var(--space-3); }
.page-header__title h1 { font-size: var(--text-2xl); font-weight: 700; color: var(--text-primary); }
.page-header__count {
  padding: 2px 10px; border-radius: var(--radius-full); background: var(--brand-primary);
  color: #fff; font-size: var(--text-sm); font-weight: 700; font-variant-numeric: tabular-nums;
}
.conn-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--radius-full);
  background: var(--color-success-soft); color: var(--color-success-darker);
  font-size: var(--text-xs); font-weight: 600;
}
.conn-tag__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); }
.legend { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.legend__item { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-secondary); }
.legend__swatch { width: 10px; height: 10px; border-radius: 3px; }

/* ---- 三欄主體 ---- */
.pos-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px 1fr 360px; }

/* == 左：班級列表 == */
.col-classrooms {
  border-right: 1px solid var(--border-color); background: var(--surface-color);
  overflow-y: auto; padding: var(--space-3);
}
.classroom-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  width: 100%; min-height: var(--touch-target-min);
  padding: var(--space-3) var(--space-3);
  border: none; border-radius: var(--radius-md); background: transparent;
  color: var(--text-secondary); font-size: var(--text-lg); font-weight: 600;
  cursor: pointer; text-align: left; margin-bottom: var(--space-1);
  transition: background-color var(--transition-fast), color var(--transition-fast);
}
.classroom-item:hover { background: var(--bg-color-soft); color: var(--text-primary); }
.classroom-item.is-active { background: var(--brand-primary); color: #fff; }
.classroom-item__badge {
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: var(--radius-full);
  background: var(--neutral-200); color: var(--text-secondary);
  font-size: var(--text-sm); font-weight: 700; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.classroom-item.is-active .classroom-item__badge { background: rgba(255,255,255,.25); color: #fff; }
.classroom-item__badge.is-zero { opacity: .5; }

/* == 中：學生 card grid == */
.col-students { overflow-y: auto; padding: var(--space-5); }
.students-section-title {
  font-size: var(--text-sm); font-weight: 700; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: .04em;
  margin: 0 0 var(--space-3); display: flex; align-items: center; gap: var(--space-2);
}
.students-section-title:not(:first-child) { margin-top: var(--space-6); }
.students-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: var(--space-3);
}

.student-card {
  position: relative;
  background: var(--surface-color); border: 1.5px solid var(--border-color); border-radius: var(--radius-lg);
  padding: var(--space-4); min-height: 128px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; text-align: left;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
}
.student-card:hover { border-color: var(--brand-primary); box-shadow: var(--shadow-md); }
.student-card:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
.student-card:active { transform: scale(.98); }
.student-card__name { font-size: var(--text-xl); font-weight: 700; color: var(--text-primary); line-height: 1.3; word-break: break-word; }
.student-card__tap-hint {
  margin-top: var(--space-2); font-size: var(--text-xs); color: var(--brand-primary); font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}

.student-card__more {
  position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: var(--radius-md);
  border: none; background: transparent; color: var(--text-tertiary); font-size: 18px; cursor: pointer;
  display: grid; place-items: center;
}
.student-card__more:hover { background: var(--bg-color-soft); color: var(--text-secondary); }

.status-pill {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  padding: 4px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 700;
}
.status-pill--bus { background: var(--color-info-soft); color: var(--color-info-darker); }
.status-pill--leave { background: var(--color-warning-soft); color: var(--color-warning-darker); }
.status-pill--picked { background: var(--color-success-soft); color: var(--color-success-darker); }
.status-pill--queued { background: var(--neutral-100); color: var(--text-secondary); }
.status-pill__dot { width: 6px; height: 6px; border-radius: 50%; }

/* 已處理（請假／娃娃車／家長已接送）卡片：降低視覺優先度、不可再點 */
.student-card.is-resolved { cursor: default; background: var(--bg-color-soft); }
.student-card.is-resolved:hover { border-color: var(--border-color); box-shadow: none; }
.student-card.is-resolved .student-card__name { color: var(--text-secondary); }

/* 已在佇列中（POS 剛按下、等待老師確認）：可視但停用，避免重複建立 */
.student-card.is-queued { cursor: default; }
.student-card.is-queued:hover { border-color: var(--border-color); box-shadow: none; }
.student-card.is-queued .student-card__name { color: var(--text-primary); }

/* more-menu popover */
.more-menu {
  position: absolute; top: 40px; right: 6px; z-index: 40;
  width: 216px; background: var(--surface-color); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: var(--space-2);
  display: none;
}
.more-menu.is-open { display: block; }
.more-menu__item {
  width: 100%; text-align: left; border: none; background: transparent; cursor: pointer;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  font-size: var(--text-sm); color: var(--text-primary);
  display: flex; flex-direction: column; gap: 2px;
}
.more-menu__item:hover { background: var(--bg-color-soft); }
.more-menu__item-note { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

/* == 右：接送排序 == */
.col-queue { border-left: 1px solid var(--border-color); background: var(--surface-color); display: flex; flex-direction: column; min-height: 0; }
.queue-header {
  flex-shrink: 0; padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--border-color-light);
  display: flex; align-items: center; justify-content: space-between;
}
.queue-header h2 { font-size: var(--text-lg); font-weight: 700; }
.queue-list { flex: 1; overflow-y: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); }
.queue-empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-tertiary); font-size: var(--text-sm); }

.queue-card {
  position: relative; overflow: hidden;
  border-radius: var(--radius-lg); border: 1px solid var(--border-color);
  background: var(--surface-color); box-shadow: var(--shadow-sm);
}
.queue-card__swipe-bg {
  position: absolute; inset: 0; background: var(--color-danger); color: #fff;
  display: flex; align-items: center; justify-content: flex-end; padding-right: var(--space-4);
  font-size: var(--text-sm); font-weight: 700;
}
.queue-card__body {
  position: relative; background: var(--surface-color);
  padding: var(--space-3) var(--space-4); touch-action: pan-y;
  transition: transform var(--transition-base);
}
.queue-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
.queue-card__name { font-size: var(--text-xl); font-weight: 700; color: var(--text-primary); line-height: 1.25; }
.queue-card__room { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: 2px; }
.source-tag { flex-shrink: 0; padding: 3px 9px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; }
.source-tag--onsite { background: var(--brand-primary); color: #fff; }
.source-tag--reservation { background: var(--color-info-soft); color: var(--color-info-darker); }
.source-tag--proxy { background: var(--neutral-700); color: #fff; }

.queue-card__meta { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

/* 5 秒倒數 bar：滿寬 → 0，錨定左側、右緣往左收（規格用語：從右側縮減到左側） */
.countdown-track { margin-top: var(--space-3); height: 6px; border-radius: var(--radius-full); background: var(--neutral-100); overflow: hidden; }
.countdown-fill { height: 100%; width: 100%; background: var(--brand-primary); border-radius: var(--radius-full); transform-origin: left; }
.countdown-fill.is-counting { transition: transform 5s linear; transform: scaleX(0); }

.waiting-flag {
  margin-top: var(--space-3); display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--text-xs); font-weight: 600; color: var(--color-success-darker);
}
.waiting-flag__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.eta-flag { margin-top: var(--space-3); font-size: var(--text-xs); color: var(--color-info-darker); font-weight: 600; }

.swipe-hint { position: absolute; bottom: 4px; right: 8px; font-size: 10px; color: var(--text-tertiary); }

/* 取消確認 strip（已送出的通知 swipe 後需二次確認，尚未送出的直接撤銷不需要） */
.confirm-cancel { display: none; margin-top: var(--space-3); gap: var(--space-2); }
.confirm-cancel.is-open { display: flex; }
.confirm-cancel button {
  flex: 1; min-height: 32px; border-radius: var(--radius-md); font-size: var(--text-xs); font-weight: 700; cursor: pointer;
}
.confirm-cancel__back { border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-secondary); }
.confirm-cancel__ok { border: none; background: var(--color-danger); color: #fff; }

.toast-host { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 600; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--neutral-800); color: #fff; padding: 10px 18px; border-radius: var(--radius-md);
  font-size: var(--text-sm); box-shadow: var(--shadow-lg); animation: toast-in .18s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1023.98px) {
  .pos-layout { grid-template-columns: 160px 1fr 300px; }
}
</style>
</head>
<body>

<div class="preview-banner">🎨 設計稿預覽 — 版面與互動皆為前端示意（本機 HTML），未串接任何真實 API／WebSocket／老師端通知</div>

<div class="app-shell">
  <aside class="rail">
    <div class="rail__logo">Ivy</div>
    <div class="rail__icon" title="首頁">🏠</div>
    <div class="rail__icon" title="學生">🧒</div>
    <div class="rail__icon is-active" title="接送管理">🚸</div>
    <div class="rail__icon" title="娃娃車">🚌</div>
    <div class="rail__icon" title="請假">📋</div>
  </aside>

  <div class="page">
    <header class="page-header">
      <div class="page-header__title">
        <h1>接送管理</h1>
        <span class="page-header__count" id="pendingCount">待接送 0</span>
        <span class="conn-tag"><span class="conn-tag__dot"></span>即時同步中</span>
      </div>
      <div class="legend">
        <span class="legend__item"><span class="legend__swatch" style="background:var(--color-info-soft);border:1px solid var(--color-info-darker)"></span>娃娃車已接送</span>
        <span class="legend__item"><span class="legend__swatch" style="background:var(--color-warning-soft);border:1px solid var(--color-warning-darker)"></span>請假</span>
        <span class="legend__item"><span class="legend__swatch" style="background:var(--color-success-soft);border:1px solid var(--color-success-darker)"></span>家長已接送</span>
      </div>
    </header>

    <div class="pos-layout">
      <nav class="col-classrooms" id="classroomList"></nav>

      <main class="col-students" id="studentsCol"></main>

      <aside class="col-queue">
        <div class="queue-header">
          <h2>接送排序</h2>
          <span class="page-header__count" id="queueCount">0</span>
        </div>
        <div class="queue-list" id="queueList"></div>
      </aside>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script>
/* ============================================================
   Mock data — 擬真但非真實個資；僅供本設計稿示意排版與互動。
   ============================================================ */
const CLASSROOMS = [
  { id: 1, name: '愛心班' },
  { id: 2, name: '陽光班' },
  { id: 3, name: '星星班' },
];

// status: idle(未接送,可點) / leave(請假) / bus(娃娃車已接送) / picked(家長已接送)
let STUDENTS = {
  1: [
    { id: 101, name: '王小美', status: 'idle' },
    { id: 102, name: '陳彥廷', status: 'idle' },
    { id: 103, name: '林宥辰', status: 'leave' },
    { id: 104, name: '黃詩涵', status: 'bus' },
    { id: 105, name: '張祐維', status: 'idle' },
    { id: 106, name: '李佳穎', status: 'picked' },
    { id: 107, name: '吳柏翰', status: 'idle' },
    { id: 108, name: '蔡沛珊', status: 'idle' },
    { id: 109, name: '許家瑜', status: 'bus' },
  ],
  2: [
    { id: 201, name: '周奕辰', status: 'idle' },
    { id: 202, name: '游子涵', status: 'idle' },
    { id: 203, name: '鄭雅筑', status: 'idle' },
    { id: 204, name: '謝秉軒', status: 'leave' },
    { id: 205, name: '曾詠絮', status: 'idle' },
    { id: 206, name: '賴柏丞', status: 'idle' },
  ],
  3: [
    { id: 301, name: '洪珮瑜', status: 'idle' },
    { id: 302, name: '楊子毅', status: 'picked' },
    { id: 303, name: '簡妤蓁', status: 'idle' },
    { id: 304, name: '范姜宇翔', status: 'idle' },
    { id: 305, name: '邱思妍', status: 'bus' },
    { id: 306, name: '潘冠廷', status: 'idle' },
    { id: 307, name: '施雅晴', status: 'idle' },
  ],
};

const CLASSROOM_NAME = Object.fromEntries(CLASSROOMS.map(c => [c.id, c.name]));

// queue item: { id, studentId, classroomId, name, room, source: onsite|reservation|proxy,
//               phase: counting|waiting, arrivedAt(ms), etaMinutes }
let queue = [
  // 家長已預約、尚未到門口（現有系統既有語意：request_source=parent + expected_arrival_at）
  { id: 'q1', studentId: 205, classroomId: 2, name: '曾詠絮', room: '陽光班', source: 'reservation', phase: 'reservation', etaMinutes: 12 },
  // 已送出、等待老師確認中（模擬 5 秒倒數已跑完的既有通知）
  { id: 'q2', studentId: 303, classroomId: 3, name: '簡妤蓁', room: '星星班', source: 'onsite', phase: 'waiting', arrivedAt: Date.now() - 3 * 60000 },
  // 代理接送示意（家長委託代理人來接——此資料源尚未存在，僅示意佇列上會長什麼樣子）
  { id: 'q3', studentId: 302, classroomId: 3, name: '楊子毅', room: '星星班', source: 'proxy', phase: 'waiting', arrivedAt: Date.now() - 60000 },
];
STUDENTS[3].find(s => s.id === 303).status = 'queued';
STUDENTS[3].find(s => s.id === 302).status = 'picked'; // 302 同時示範「已放學」但佇列卡片保留：見下方說明

let activeClassroomId = CLASSROOMS[0].id;
let openMenuStudentId = null;
let seq = 100;

// ── 工具 ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function countIdleAndQueued(classroomId) {
  return STUDENTS[classroomId].filter(s => s.status === 'idle' || s.status === 'queued').length;
}

// ── 渲染：左側班級列表 ────────────────────────────────────────────────────
function renderClassrooms() {
  const el = document.getElementById('classroomList');
  el.innerHTML = '';
  CLASSROOMS.forEach(c => {
    const count = countIdleAndQueued(c.id);
    const btn = document.createElement('button');
    btn.className = 'classroom-item' + (c.id === activeClassroomId ? ' is-active' : '');
    btn.innerHTML = `<span>${c.name}</span><span class="classroom-item__badge${count === 0 ? ' is-zero' : ''}">${count}</span>`;
    btn.addEventListener('click', () => { activeClassroomId = c.id; renderAll(); });
    el.appendChild(btn);
  });
}

// ── 渲染：中間學生卡片 ────────────────────────────────────────────────────
const STATUS_META = {
  bus: { label: '娃娃車已接送', pill: 'bus', icon: '🚌' },
  leave: { label: '請假', pill: 'leave', icon: '🌙' },
  picked: { label: '家長已接送', pill: 'picked', icon: '✅' },
};

function studentCardHtml(s) {
  if (s.status === 'idle') {
    // 卡片本身用 div[role=button]（非 <button>）：more icon 是巢狀真按鈕，
    // <button> 不能包 <button>，瀏覽器會自動提早收掉外層造成版面錯亂。
    return `
      <div class="student-card" role="button" tabindex="0" data-student="${s.id}">
        <button type="button" class="student-card__more" data-more="${s.id}" aria-label="更多動作">⋮</button>
        <div class="student-card__name">${s.name}</div>
        <div class="student-card__tap-hint">👆 點卡片＝現場接送</div>
        ${moreMenuHtml(s.id)}
      </div>`;
  }
  if (s.status === 'queued') {
    return `
      <div class="student-card is-queued" data-student="${s.id}">
        <div class="student-card__name">${s.name}</div>
        <span class="status-pill status-pill--queued"><span class="status-pill__dot" style="background:var(--brand-primary)"></span>通知中，見右側佇列</span>
      </div>`;
  }
  const meta = STATUS_META[s.status];
  return `
    <div class="student-card is-resolved" data-student="${s.id}">
      <button type="button" class="student-card__more" data-more="${s.id}" aria-label="更多動作">⋮</button>
      <div class="student-card__name">${s.name}</div>
      <span class="status-pill status-pill--${meta.pill}">${meta.icon} ${meta.label}</span>
      ${moreMenuHtml(s.id)}
    </div>`;
}

function moreMenuHtml(studentId) {
  const open = openMenuStudentId === studentId ? ' is-open' : '';
  return `
    <div class="more-menu${open}" data-menu="${studentId}">
      <button type="button" class="more-menu__item" data-mark="${studentId}" data-mark-status="bus">
        🚌 標記已被娃娃車接走
        <span class="more-menu__item-note">設計預覽・尚未串接娃娃車資料，之後再擴充</span>
      </button>
      <button type="button" class="more-menu__item" data-mark="${studentId}" data-mark-status="leave">
        🌙 標記請假
        <span class="more-menu__item-note">設計預覽・尚未串接請假資料，之後再擴充</span>
      </button>
    </div>`;
}

function renderStudents() {
  const el = document.getElementById('studentsCol');
  const list = STUDENTS[activeClassroomId];
  const idle = list.filter(s => s.status === 'idle' || s.status === 'queued');
  const resolved = list.filter(s => s.status !== 'idle' && s.status !== 'queued');

  let html = '';
  html += `<h3 class="students-section-title">待接送・${idle.length}</h3>`;
  html += `<div class="students-grid">${idle.map(studentCardHtml).join('')}</div>`;
  if (resolved.length) {
    html += `<h3 class="students-section-title">已處理（請假 / 娃娃車已接送 / 家長已接送）・${resolved.length}</h3>`;
    html += `<div class="students-grid">${resolved.map(studentCardHtml).join('')}</div>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('[data-student].student-card:not(.is-resolved):not(.is-queued)').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-more]') || e.target.closest('.more-menu')) return;
      onTapStudent(Number(card.dataset.student));
    });
    card.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('[data-more]') || e.target.closest('.more-menu')) return;
      e.preventDefault();
      onTapStudent(Number(card.dataset.student));
    });
  });
  el.querySelectorAll('[data-more]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.more);
      openMenuStudentId = openMenuStudentId === id ? null : id;
      renderStudents();
    });
  });
  el.querySelectorAll('[data-mark]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.mark);
      const newStatus = btn.dataset.markStatus;
      const s = list.find(x => x.id === id);
      if (s) s.status = newStatus;
      openMenuStudentId = null;
      toast('僅為視覺示意，此動作規劃中尚未串接後端資料');
      renderAll();
    });
  });
}

function onTapStudent(studentId) {
  const s = STUDENTS[activeClassroomId].find(x => x.id === studentId);
  if (!s || s.status !== 'idle') return;
  s.status = 'queued';
  const item = {
    id: 'q' + (seq++),
    studentId,
    classroomId: activeClassroomId,
    name: s.name,
    room: CLASSROOM_NAME[activeClassroomId],
    source: 'onsite',
    phase: 'counting',
    arrivedAt: Date.now(),
  };
  queue.unshift(item);
  renderAll();

  // 5 秒倒數：0 秒後才視為「已通知教師端」（本設計稿以 toast 模擬）
  setTimeout(() => {
    const q = queue.find(x => x.id === item.id);
    if (!q || q.phase !== 'counting') return; // 期間被 swipe 取消
    q.phase = 'waiting';
    renderQueue();
    toast(`已通知教師端：${item.name}`);
  }, 5000);
}

// ── 渲染：右側接送排序 ────────────────────────────────────────────────────
const SOURCE_META = {
  onsite: { label: '現場', cls: 'onsite' },
  reservation: { label: '預約', cls: 'reservation' },
  proxy: { label: '代理', cls: 'proxy' },
};

function queueCardHtml(item) {
  const meta = SOURCE_META[item.source];
  let statusBlock = '';
  if (item.phase === 'counting') {
    statusBlock = `<div class="countdown-track"><div class="countdown-fill" data-fill="${item.id}"></div></div>`;
  } else if (item.phase === 'reservation') {
    statusBlock = `<div class="eta-flag">⏱ 預計還有 ${item.etaMinutes} 分鐘到門口</div>`;
  } else {
    statusBlock = `<div class="waiting-flag"><span class="waiting-flag__dot"></span>已通知教師端，等待確認</div>`;
  }
  return `
    <div class="queue-card" data-queue="${item.id}">
      <div class="queue-card__swipe-bg">左滑取消 →</div>
      <div class="queue-card__body" data-body="${item.id}">
        <div class="queue-card__top">
          <div>
            <div class="queue-card__name">${item.name}</div>
            <div class="queue-card__room">${item.room}</div>
          </div>
          <span class="source-tag source-tag--${meta.cls}">${meta.label}</span>
        </div>
        ${statusBlock}
        <div class="confirm-cancel" data-confirm="${item.id}">
          <button type="button" class="confirm-cancel__back" data-cancel-back="${item.id}">返回</button>
          <button type="button" class="confirm-cancel__ok" data-cancel-ok="${item.id}">確定取消通知</button>
        </div>
        <div class="swipe-hint">← 左滑可取消</div>
      </div>
    </div>`;
}

function renderQueue() {
  const el = document.getElementById('queueList');
  document.getElementById('queueCount').textContent = String(queue.length);
  document.getElementById('pendingCount').textContent =
    '待接送 ' + Object.values(STUDENTS).flat().filter(s => s.status === 'idle' || s.status === 'queued').length;

  if (!queue.length) {
    el.innerHTML = '<div class="queue-empty">目前沒有進行中的接送<br />點選中間學生卡片即可開始</div>';
    return;
  }
  el.innerHTML = queue.map(queueCardHtml).join('');

  // 啟動倒數動畫（下一 frame 才加 class，確保 transition 觸發）
  queue.filter(q => q.phase === 'counting').forEach(q => {
    const fill = el.querySelector(`[data-fill="${q.id}"]`);
    if (fill) requestAnimationFrame(() => requestAnimationFrame(() => fill.classList.add('is-counting')));
  });

  attachSwipeHandlers();
  el.querySelectorAll('[data-cancel-back]').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = el.querySelector(`[data-body="${btn.dataset.cancelBack}"]`);
      body.style.transform = 'translateX(0)';
      el.querySelector(`[data-confirm="${btn.dataset.cancelBack}"]`).classList.remove('is-open');
    });
  });
  el.querySelectorAll('[data-cancel-ok]').forEach(btn => {
    btn.addEventListener('click', () => cancelQueueItem(btn.dataset.cancelOk));
  });
}

function cancelQueueItem(id) {
  const item = queue.find(q => q.id === id);
  if (!item) return;
  queue = queue.filter(q => q.id !== id);
  if (item.source === 'onsite') {
    const s = STUDENTS[item.classroomId].find(x => x.id === item.studentId);
    if (s) s.status = 'idle';
  }
  toast(`已取消通知：${item.name}`);
  renderAll();
}

// ── 手勢：左滑取消（demo 用 pointer events，簡化物理效果）──────────────────
function attachSwipeHandlers() {
  document.querySelectorAll('.queue-card__body').forEach(body => {
    let startX = null, dx = 0, dragging = false;
    const id = body.dataset.body;

    const onDown = (e) => {
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      dragging = true;
      body.style.transition = 'none';
    };
    const onMove = (e) => {
      if (!dragging) return;
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      dx = Math.min(0, x - startX);
      body.style.transform = `translateX(${dx}px)`;
    };
    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      body.style.transition = '';
      const item = queue.find(q => q.id === id);
      if (dx < -90) {
        if (item && item.phase === 'counting') {
          // 倒數中：尚未送出通知，直接撤銷不需二次確認
          cancelQueueItem(id);
          return;
        }
        // 已送出（waiting / reservation）：對齊既有 handleCancel 的二次確認慣例
        body.style.transform = 'translateX(-96px)';
        document.querySelector(`[data-confirm="${id}"]`)?.classList.add('is-open');
      } else {
        body.style.transform = 'translateX(0)';
      }
      dx = 0;
    };

    body.addEventListener('mousedown', onDown);
    body.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('mousemove', onMove);
    body.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('mouseup', onUp);
    body.addEventListener('touchend', onUp);
  });
}

function renderAll() {
  renderClassrooms();
  renderStudents();
  renderQueue();
}

renderAll();
</script>
</body>
</html>
