<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/LOGO.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <link rel="manifest" href="/public.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="{{TB_THEME_PARENT}}">
    <title>{{TB_PUBLIC_TITLE}}</title>
    <meta name="description" content="{{TB_META_DESC}}">

    <!-- 分享預覽（老師把連結貼到家長 LINE@／群組時聊天室渲染的卡片）。
         LINE 的爬蟲不執行 JS，src/public/router.ts 設的 document.title 對它無效——
         預覽卡看得到的每一個字都必須是這份靜態 HTML 裡的字面值。

         多租戶（4d/fb）：一個 build 產物服務多個園所，品牌值不能烤進 HTML，改成
         TB_ 系列 token（下方 content 內的雙大括號），由 **nginx sub_filter 依 $host
         逐請求替換**（方案 A）：
           - map 定義：nginx-tenant-brand.conf（由 scripts/gen-tenant-brand-conf.mjs
             從 branding/tenants.json 產生，勿手改）
           - dev server：vite.config.js 的 brand-tokens plugin 用 default 條目替換
           - 跑 dist 但沒有 nginx（vite preview / 後端 Playwright E2E）：
             先跑 `node scripts/apply-brand-tokens.mjs`
         ⛔ 刻意**不**保留字面 fallback：漏配置時畫面出現未替換的 token 是可被
         scripts/check-brand-tokens.mjs 攔截的 fail-loud；靜默吐別間園所的品牌不行。

         TB_ORIGIN 由 nginx 展開成 $scheme://$host（不寫死 https，dev/staging 走 http）。
         og:image 的 ?v= 是給 LINE 圖片 CDN 的 cache-bust：LINE 按整串網址快取圖，
         換海報但網址不變會一直吃舊圖且無官方清快取工具——改版海報時把該租戶的
         TB_OG_POSTER_V 改成當天日期（branding/tenants.json）。 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{TB_ORG_NAME}}">
    <meta property="og:url" content="{{TB_ORIGIN}}/public.html#/activity">
    <meta property="og:title" content="{{TB_PUBLIC_TITLE}}">
    <meta property="og:description" content="{{TB_OG_DESC}}">
    <meta property="og:image" content="{{TB_ORIGIN}}/images/activity-poster.jpg?v={{TB_OG_POSTER_V}}">
    <meta property="og:image:alt" content="{{TB_POSTER_ALT}}">
    <meta name="twitter:card" content="summary_large_image">

    <!-- A2: 公開頁第三 entry，未登入家長只下載 public 包 + vue-core，不載 admin SPA -->
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/public/main.ts"></script>
</body>

</html>
